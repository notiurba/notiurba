$kind: http-request
description: "NOT-89. Un código que no es NU- más 6 o más dígitos responde 400 VALIDACION con campo «codigo»."
url: "{{baseUrl}}/api/reportes/123"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 si el código está mal formado', function () {
          pm.response.to.have.status(400);
      });
      pm.test('Formato de error del contrato', function () {
          const r = pm.response.json();
          pm.expect(r.codigo).to.eql('VALIDACION');
          pm.expect(r.campo).to.eql('codigo');
          pm.expect(r.mensaje).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 10200
