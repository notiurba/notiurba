$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK',()=>pm.response.to.have.status(200));
      pm.test('15 categorías',()=>pm.expect(pm.response.json().length).to.eql(15));
    language: text/javascript
order: 3000
