$kind: http-request
description: "Exige sesión y un reporte propio (usa codigoReporte). Sube foto-valida.png. 201 con la foto (orden y URL https)."
url: "{{baseUrl}}/api/reportes/{{codigoReporte}}/fotos"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: foto
      src:
        - /Users/andy/Desktop/universidad/gestion-proyectos/notiurba/docs/api/archivos-de-prueba/foto-valida.png
      description: ""
      disabled: false
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Foto subida (201)', function () {
          pm.response.to.have.status(201);
      });
      if (pm.response.code === 201) {
          const r = pm.response.json();
          pm.test('Es el reporte consultado', function () {
              pm.expect(r.codigoSeguimiento).to.eql(pm.collectionVariables.get('codigoReporte'));
          });
          pm.test('Trae el orden y una URL https pública', function () {
              pm.expect(r.foto.orden).to.be.within(1, 3);
              pm.expect(r.foto.url).to.match(/^https:\/\//);
          });
      }
    language: text/javascript
order: 11400
