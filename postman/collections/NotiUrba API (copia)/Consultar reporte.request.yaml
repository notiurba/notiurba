$kind: http-request
description: "NOT-89. Exige sesión; solo reportes propios. Antes hay que ejecutar «Crear reporte» (guarda «codigoReporte»). 200 con categoría, descripción, coordenadas, comuna, barrio, estado, vigencia, fotos (lista, vacía si no tiene), historial y envío."
url: "{{baseUrl}}/api/reportes/{{codigoReporte}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Reporte propio (200)', function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          const r = pm.response.json();
          pm.test('Trae el código consultado', function () {
              pm.expect(r.codigoSeguimiento).to.eql(pm.collectionVariables.get('codigoReporte'));
          });
          pm.test('Trae categoría, descripción y estado', function () {
              pm.expect(r.categoria).to.have.all.keys('idCategoria', 'nombre');
              pm.expect(r.descripcion).to.be.a('string').and.not.empty;
              pm.expect(r.estado).to.be.oneOf(['Recibido', 'Enviado', 'En trámite', 'Resuelto']);
          });
          pm.test('Trae coordenadas, comuna y barrio (pueden ser null)', function () {
              pm.expect(r).to.have.all.keys('codigoSeguimiento', 'estado', 'categoria', 'descripcion', 'latitud',
                  'longitud', 'comuna', 'barrio', 'direccionIncidente', 'matriculaCuentaServicio', 'radicadoOficial',
                  'fotos', 'creadoEn', 'vigenteHasta', 'historial', 'envio');
          });
          pm.test('La vigencia es posterior a la creación', function () {
              pm.expect(new Date(r.vigenteHasta).getTime()).to.be.above(new Date(r.creadoEn).getTime());
          });
          pm.test('fotos es una lista (vacía si no tiene foto)', function () {
              pm.expect(r.fotos).to.be.an('array');
              r.fotos.forEach(function (f) {
                  pm.expect(f).to.have.all.keys('orden', 'url');
                  pm.expect(f.url).to.match(/^https:\/\//);
              });
          });
          pm.test('El historial trae al menos el estado inicial', function () {
              pm.expect(r.historial).to.be.an('array').that.is.not.empty;
              pm.expect(r.historial[0].estado).to.eql('Recibido');
          });
          pm.test('envio es null o trae estado', function () {
              if (r.envio !== null) {
                  pm.expect(r.envio.estado).to.be.oneOf(['PENDIENTE', 'ENVIADO', 'FALLIDO']);
              }
          });
      }
    language: text/javascript
order: 10000
