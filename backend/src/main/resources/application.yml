spring:
  application:
    name: notiurba-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notiurba}
    username: ${DB_USER:notiurba}
    password: ${DB_PASSWORD}          # obligatoria: variable de entorno (ver .env.example)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate              # el esquema lo crean las migraciones de Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      adminPassword: ${ADMIN_DEV_PASSWORD}   # obligatoria: nunca en el repo (ver V4__usuario_admin_semilla.sql)

server:
  port: ${PORT:8080}

notiurba:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secreto: ${JWT_SECRET}          # obligatoria: nunca en el repo
    expiracion-minutos: 60
