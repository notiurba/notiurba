spring:
  application:
    name: notiurba-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notiurba}
    username: ${DB_USER:notiurba}
    password: ${DB_PASSWORD}          # obligatoria: variable de entorno (ver .env.example)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate              # el esquema lo crean las migraciones de Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

notiurba:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
