spring:
  application:
    name: notiurba-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notiurba}
    username: ${DB_USER:notiurba}
    password: ${DB_PASSWORD}          # obligatoria: variable de entorno (ver .env.example)
  mvc:
    problemdetails:
      enabled: true                   # los errores (400/401/409) llevan su mensaje en «detail»
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate              # el esquema lo crean las migraciones de Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      adminPassword: ${ADMIN_DEV_PASSWORD}   # obligatoria: nunca en el repo (ver V4__usuario_admin_semilla.sql)

server:
  port: ${PORT:8080}

notiurba:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secreto: ${JWT_SECRET}          # obligatoria: nunca en el repo
    expiracion-minutos: 60
  google:
    client-id: ${GOOGLE_CLIENT_ID}  # obligatoria: ID de cliente OAuth de Google Cloud (aud del ID token)
  recuperacion:
    # Página del frontend «Nueva contraseña»; el backend agrega ?token=...
    enlace: ${RECUPERACION_ENLACE:http://localhost:5173/app/nueva-contrasena}
    # Solo desarrollo: escribe el enlace en el log mientras no haya envío de correo real
    mostrar-enlace-en-log: ${RECUPERACION_MOSTRAR_ENLACE:false}
