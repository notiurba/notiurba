$kind: http-request
description: "Exige sesión. Crea un reporte de prueba cada vez que se ejecuta y guarda su código en la variable de colección «codigoReporte» para los casos de consulta. 201 con Location y codigoSeguimiento leído de la base (NOT-69)."
url: "{{baseUrl}}/api/reportes"
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
body:
  type: json
  content: |-
    {
      "idCategoria": 6,
      "descripcion": "Prueba de Postman: consulta sobre el uso del suelo",
      "autorizaEnvio": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Reporte creado (201)', function () {
          pm.response.to.have.status(201);
      });

      if (pm.response.code === 201) {
          const cuerpo = pm.response.json();
          pm.test('El código tiene el formato NU-000123', function () {
              pm.expect(cuerpo.codigoSeguimiento).to.match(/^NU-\d{6,}$/);
          });
          pm.test('Location apunta al código devuelto', function () {
              pm.expect(pm.response.headers.get('Location')).to.eql('/api/reportes/' + cuerpo.codigoSeguimiento);
          });
          pm.test('Nace en estado Recibido', function () {
              pm.expect(cuerpo.estado).to.eql('Recibido');
          });
          pm.collectionVariables.set('codigoReporte', cuerpo.codigoSeguimiento);
      }
    language: text/javascript
order: 9000
