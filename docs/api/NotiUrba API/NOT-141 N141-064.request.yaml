$kind: "http-request"
description: "Vista previa válida sin persistencia\n\n Contrato inspeccionado: local d8e8b2b y develop 8b8419a (14/11/2026). Expectativa documental; no es respuesta observada. Omitida no equivale a aprobada.\n\nRespuesta esperada: HTTP 200. Las aserciones siguientes definen el cuerpo del contrato; no se ha capturado respuesta de Render. Errores: {codigo, mensaje, campo}; mensaje es texto, campo puede ser null. Sin permisos en recurso ajeno: 404 por ocultación, no 403."
url: "{{baseUrl}}/api/reportes/vista-previa"
method: "POST"
order: 20630
auth:
  type: "bearer"
  credentials:
    token: "{{token}}"
headers:
  Content-Type: "application/json"
body:
  type: "json"
  content: "{\n  \"idCategoria\": {{idCategoria}},\n  \"idBarrio\": {{idBarrio}},\n  \"descripcion\": \"Prueba sintética QA NOT-141 de una incidencia urbana\",\n  \"direccionIncidente\": \"Dirección sintética QA\",\n  \"totalFotos\": 0\n}"
scripts:
  -
    type: "beforeRequest"
    code: "if (!pm.variables.get('token')) { console.warn('BLOQUEADA: falta token'); pm.execution.skipRequest(); }\nif (!pm.variables.get('idCategoria')) { console.warn('BLOQUEADA: falta idCategoria'); pm.execution.skipRequest(); }\nif (!pm.variables.get('idBarrio')) { console.warn('BLOQUEADA: falta idBarrio'); pm.execution.skipRequest(); }"
    language: "text/javascript"
  -
    type: "afterResponse"
    code: "pm.test('HTTP 200',()=>pm.response.to.have.status(200));\npm.test('Contrato',()=>pm.expect(pm.response.json()).to.include.all.keys('asunto','texto','secciones','permiteCorreo','ruta','requiereEvidencia'));"
    language: "text/javascript"
