$kind: "http-request"
description: "Eliminar MI cuenta (solo QA aislada)\n\nDESTRUYE LA CUENTA Y TODOS SUS DATOS. Ejecutar al final y únicamente con cuenta QA desechable. Contrato inspeccionado: local d8e8b2b y develop 8b8419a (14/11/2026). Expectativa documental; no es respuesta observada. Omitida no equivale a aprobada.\n\nRespuesta esperada: HTTP 204. Las aserciones siguientes definen el cuerpo del contrato; no se ha capturado respuesta de Render. Errores: {codigo, mensaje, campo}; mensaje es texto, campo puede ser null. Sin permisos en recurso ajeno: 404 por ocultación, no 403."
url: "{{baseUrl}}/api/usuarios/me"
method: "DELETE"
order: 20220
auth:
  type: "bearer"
  credentials:
    token: "{{token}}"
scripts:
  -
    type: "beforeRequest"
    code: "if (pm.variables.get('habilitarEliminacion') !== 'true') {\n  console.warn('OMITIDA por seguridad: active habilitarEliminacion solo en un entorno QA autorizado.');\n  pm.execution.skipRequest();\n}\nif (!pm.variables.get('token')) { console.warn('BLOQUEADA: falta token'); pm.execution.skipRequest(); }\nif (pm.variables.get('cuentaQAConfirmada') !== 'true') pm.execution.skipRequest();"
    language: "text/javascript"
  -
    type: "afterResponse"
    code: "pm.test('Estado HTTP esperado: 204', function () { pm.expect([204]).to.include(pm.response.code); });"
    language: "text/javascript"
