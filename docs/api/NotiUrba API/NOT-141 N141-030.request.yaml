$kind: "http-request"
description: "Solicitud de envío de correo QA\n\nENVÍA un correo o solicita envío asíncrono. Confirmar destinatario QA en Render ANTES. Contrato inspeccionado: local d8e8b2b y develop 8b8419a (14/11/2026). Expectativa documental; no es respuesta observada. Omitida no equivale a aprobada.\n\nRespuesta esperada: HTTP 202. Las aserciones siguientes definen el cuerpo del contrato; no se ha capturado respuesta de Render. Errores: {codigo, mensaje, campo}; mensaje es texto, campo puede ser null. Sin permisos en recurso ajeno: 404 por ocultación, no 403."
url: "{{baseUrl}}/api/reportes/{{codigoReporte}}/enviar"
method: "POST"
order: 20290
auth:
  type: "bearer"
  credentials:
    token: "{{token}}"
scripts:
  -
    type: "beforeRequest"
    code: "if (pm.variables.get('habilitarEnvioCorreo') !== 'true') {\n  console.warn('OMITIDA por seguridad: active habilitarEnvioCorreo solo en un entorno QA autorizado.');\n  pm.execution.skipRequest();\n}\nif (!pm.variables.get('codigoReporte')) { console.warn('BLOQUEADA: falta codigoReporte'); pm.execution.skipRequest(); }\nif (!pm.variables.get('token')) { console.warn('BLOQUEADA: falta token'); pm.execution.skipRequest(); }\nif (pm.variables.get('destinoQAConfirmado') !== 'true' || pm.variables.get('cuentaQAConfirmada') !== 'true') pm.execution.skipRequest();"
    language: "text/javascript"
  -
    type: "afterResponse"
    code: "pm.test('Estado HTTP esperado: 202', function () { pm.expect([202]).to.include(pm.response.code); });"
    language: "text/javascript"
