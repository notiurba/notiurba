$kind: "http-request"
description: "Editar perfil: caso válido QA\n\nATENCIÓN: requiere valores numéricos reales: editar manualmente antes de ejecutar. Solo cuenta desechable. Contrato inspeccionado: local d8e8b2b y develop 8b8419a (14/11/2026). Expectativa documental; no es respuesta observada. Omitida no equivale a aprobada.\n\nRespuesta esperada: HTTP 200. Las aserciones siguientes definen el cuerpo del contrato; no se ha capturado respuesta de Render. Errores: {codigo, mensaje, campo}; mensaje es texto, campo puede ser null. Sin permisos en recurso ajeno: 404 por ocultación, no 403."
url: "{{baseUrl}}/api/usuarios/me"
method: "PUT"
order: 20180
auth:
  type: "bearer"
  credentials:
    token: "{{token}}"
headers:
  Content-Type: "application/json"
body:
  type: "json"
  content: "{\n  \"nombres\": \"QA\",\n  \"apellidos\": \"NotiUrba\",\n  \"idTipoDocumento\": {{idTipoDocumento}},\n  \"numeroDocumento\": \"{{documentoRegistro}}\",\n  \"idBarrio\": {{idBarrio}},\n  \"direccionCorrespondencia\": \"Dirección QA\",\n  \"telefono\": \"3000000000\"\n}"
scripts:
  -
    type: "beforeRequest"
    code: "if (pm.variables.get('habilitarEscrituras') !== 'true') {\n  console.warn('OMITIDA por seguridad: active habilitarEscrituras solo en un entorno QA autorizado.');\n  pm.execution.skipRequest();\n}\nif (!pm.variables.get('token')) { console.warn('BLOQUEADA: falta token'); pm.execution.skipRequest(); }\nif (!pm.variables.get('idTipoDocumento')) { console.warn('BLOQUEADA: falta idTipoDocumento'); pm.execution.skipRequest(); }\nif (!pm.variables.get('idBarrio')) { console.warn('BLOQUEADA: falta idBarrio'); pm.execution.skipRequest(); }\nif (pm.variables.get('cuentaQAConfirmada') !== 'true') pm.execution.skipRequest();"
    language: "text/javascript"
  -
    type: "afterResponse"
    code: "pm.test('Estado HTTP esperado: 200', function () { pm.expect([200]).to.include(pm.response.code); });"
    language: "text/javascript"
