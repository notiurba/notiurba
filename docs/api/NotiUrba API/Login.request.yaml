$kind: http-request
description: Público. 200 {token, rol}; 401 si las credenciales son inválidas. Guarda el token en la variable de colección «token».
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "correo": "ciudadano@example.com",
      "password": "TU_CONTRASENA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login correcto (200)', function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          const cuerpo = pm.response.json();
          pm.collectionVariables.set('token', cuerpo.token);
      }
    language: text/javascript
order: 2000
