$kind: "http-request"
description: "Sin sesión GET /api/reportes/{{codigoReporte}}/envio\n\nDevuelve PENDIENTE, ENVIADO o FALLIDO según intento de envío. Contrato inspeccionado: local d8e8b2b y develop 8b8419a (14/11/2026). Expectativa documental; no es respuesta observada. Omitida no equivale a aprobada.\n\nRespuesta esperada: HTTP 401. Las aserciones siguientes definen el cuerpo del contrato; no se ha capturado respuesta de Render. Errores: {codigo, mensaje, campo}; mensaje es texto, campo puede ser null. Sin permisos en recurso ajeno: 404 por ocultación, no 403."
url: "{{baseUrl}}/api/reportes/{{codigoReporte}}/envio"
method: "GET"
order: 20800
auth:
  type: "noauth"
scripts:
  -
    type: "beforeRequest"
    code: "if (!pm.variables.get('codigoReporte')) { console.warn('BLOQUEADA: falta codigoReporte'); pm.execution.skipRequest(); }"
    language: "text/javascript"
  -
    type: "afterResponse"
    code: "pm.test('HTTP 401',()=>pm.response.to.have.status(401));\npm.test('Código de seguridad',()=>pm.expect(pm.response.json().codigo).to.eql('NO_AUTENTICADO'));\npm.test('Código NO_AUTENTICADO',()=>pm.expect(pm.response.json().codigo).to.eql('NO_AUTENTICADO'));"
    language: "text/javascript"
