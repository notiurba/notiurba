$kind: http-request
description: "NOT-75. Sin declarar que es mayor de 18 años responde 400 VALIDACION, campo declaraMayorEdad. No crea ninguna cuenta ni gasta correo."
url: "{{baseUrl}}/api/auth/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombres": "Ana",
      "apellidos": "Prueba",
      "idTipoDocumento": 1,
      "numeroDocumento": "0000000002",
      "idBarrio": 1,
      "direccionCorrespondencia": "Calle 0 # 0-00",
      "correo": "mayor@example.com",
      "telefono": "3000000000",
      "password": "Clave1234",
      "aceptaPrivacidad": true,
      "declaraMayorEdad": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sin declarar mayoría de edad (400)', function () {
          pm.response.to.have.status(400);
      });
      pm.test('Formato de error del contrato', function () {
          const r = pm.response.json();
          pm.expect(r.codigo).to.eql('VALIDACION');
          pm.expect(r.campo).to.eql('declaraMayorEdad');
      });
    language: text/javascript
order: 1400
