$kind: http-request
description: "NOT-75. Usa el correo que acaba de registrar «Registro» (ejecútalo antes) con un documento distinto. Responde 409 CORREO_YA_REGISTRADO, campo correo."
url: "{{baseUrl}}/api/auth/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombres": "Ana",
      "apellidos": "Prueba",
      "idTipoDocumento": 1,
      "numeroDocumento": "{{documentoOtro}}",
      "idBarrio": 1,
      "direccionCorrespondencia": "Calle 0 # 0-00",
      "correo": "{{correoRegistro}}",
      "telefono": "3000000000",
      "password": "Clave1234",
      "aceptaPrivacidad": true,
      "declaraMayorEdad": true
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('documentoOtro', String(Date.now()));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Correo repetido rechazado (409)', function () {
          pm.response.to.have.status(409);
      });
      pm.test('Formato de error del contrato', function () {
          const r = pm.response.json();
          pm.expect(r.codigo).to.eql('CORREO_YA_REGISTRADO');
          pm.expect(r.campo).to.eql('correo');
          pm.expect(r.mensaje).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 1200
