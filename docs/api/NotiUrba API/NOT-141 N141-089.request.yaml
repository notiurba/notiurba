    type: "beforeRequest"
    code: "if (!pm.variables.get('token')) { console.warn('BLOQUEADA: falta token'); pm.execution.skipRequest(); }"
    language: "text/javascript"
  -
    type: "afterResponse"
    code: "pm.test('HTTP 403',()=>pm.response.to.have.status(403));\npm.test('Código de seguridad',()=>pm.expect(pm.response.json().codigo).to.eql('SIN_PERMISO'));\npm.test('Código SIN_PERMISO',()=>pm.expect(pm.response.json().codigo).to.eql('SIN_PERMISO'));"
    language: "text/javascript"
