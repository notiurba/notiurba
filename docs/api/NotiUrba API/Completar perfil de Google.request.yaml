      "apellidos": "Apellido de ejemplo",
      "idTipoDocumento": 1,
      "numeroDocumento": "0000000000",
      "idBarrio": 1,
      "direccionCorrespondencia": "Calle 0 # 0-00",
      "telefono": "3000000000",
      "aceptaPrivacidad": true,
      "declaraMayorEdad": true
