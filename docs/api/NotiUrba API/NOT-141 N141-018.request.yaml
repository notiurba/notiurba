$kind: "http-request"
description: "Editar perfil: falta nombres\n\nValidación falla antes de persistir. Ajustar idBarrio/idTipoDocumento si es necesario. Contrato inspeccionado: local d8e8b2b y develop 8b8419a (14/11/2026). Expectativa documental; no es respuesta observada. Omitida no equivale a aprobada.\n\nRespuesta esperada: HTTP 400. Las aserciones siguientes definen el cuerpo del contrato; no se ha capturado respuesta de Render. Errores: {codigo, mensaje, campo}; mensaje es texto, campo puede ser null. Sin permisos en recurso ajeno: 404 por ocultación, no 403."
url: "{{baseUrl}}/api/usuarios/me"
method: "PUT"
order: 20170
auth:
  type: "bearer"
  credentials:
    token: "{{token}}"
headers:
  Content-Type: "application/json"
body:
  type: "json"
  content: "{\n  \"nombres\": \"\",\n  \"apellidos\": \"Prueba\",\n  \"idTipoDocumento\": 1,\n  \"numeroDocumento\": \"QA12345\",\n  \"idBarrio\": 1,\n  \"direccionCorrespondencia\": \"Calle de prueba\",\n  \"telefono\": \"3000000000\"\n}"
scripts:
  -
    type: "beforeRequest"
    code: "if (!pm.variables.get('token')) { console.warn('BLOQUEADA: falta token'); pm.execution.skipRequest(); }"
    language: "text/javascript"
  -
    type: "afterResponse"
    code: "pm.test('Estado HTTP esperado: 400', function () { pm.expect([400]).to.include(pm.response.code); });\npm.test('La API muestra un error', function () { const r = pm.response.json(); pm.expect(r).to.have.property('mensaje'); });\npm.test('Código VALIDACION',()=>pm.expect(pm.response.json().codigo).to.eql('VALIDACION'));"
    language: "text/javascript"
