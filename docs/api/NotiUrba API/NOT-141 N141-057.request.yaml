    type: "afterResponse"
    code: "pm.test('HTTP 200',()=>pm.response.to.have.status(200));\npm.test('Contrato',()=>pm.expect(pm.response.json()).to.include.all.keys(\"vigencia\",\"total\",\"atendidos\",\"porcentajeAtendidos\",\"sinComuna\",\"porEstado\",\"porCategoria\",\"porComuna\"));"
    language: "text/javascript"
