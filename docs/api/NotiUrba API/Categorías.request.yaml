$kind: http-request
description: Exige sesión (cualquier rol). Usa Bearer {{token}}.
url: "{{baseUrl}}/api/categorias"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Trae las 15 categorías', function () {
          pm.expect(pm.response.json().length).to.eql(15);
      });
    language: text/javascript
order: 7000
