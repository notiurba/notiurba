$kind: "http-request"
description: "Consultar perfil sin sesión\n\n Contrato inspeccionado: local d8e8b2b y develop 8b8419a (14/11/2026). Expectativa documental; no es respuesta observada. Omitida no equivale a aprobada.\n\nRespuesta esperada: HTTP 401. Las aserciones siguientes definen el cuerpo del contrato; no se ha capturado respuesta de Render. Errores: {codigo, mensaje, campo}; mensaje es texto, campo puede ser null. Sin permisos en recurso ajeno: 404 por ocultación, no 403."
url: "{{baseUrl}}/api/usuarios/me"
method: "GET"
order: 20160
auth:
  type: "noauth"
scripts:
  -
    type: "afterResponse"
    code: "pm.test('Estado HTTP esperado: 401', function () { pm.expect([401]).to.include(pm.response.code); });\npm.test('Error de autenticación', function () { const r = pm.response.json(); pm.expect(r).to.have.property('codigo'); });\npm.test('Código NO_AUTENTICADO',()=>pm.expect(pm.response.json().codigo).to.eql('NO_AUTENTICADO'));"
    language: "text/javascript"
