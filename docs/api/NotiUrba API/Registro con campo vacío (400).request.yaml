$kind: http-request
description: "NOT-75. Con «nombres» vacío responde 400 VALIDACION, campo nombres. No crea ninguna cuenta ni gasta correo."
url: "{{baseUrl}}/api/auth/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombres": "",
      "apellidos": "Prueba",
      "idTipoDocumento": 1,
      "numeroDocumento": "0000000001",
      "idBarrio": 1,
      "direccionCorrespondencia": "Calle 0 # 0-00",
      "correo": "vacio@example.com",
      "telefono": "3000000000",
      "password": "Clave1234",
      "aceptaPrivacidad": true,
      "declaraMayorEdad": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Campo vacío rechazado (400)', function () {
          pm.response.to.have.status(400);
      });
      pm.test('Formato de error del contrato', function () {
          const r = pm.response.json();
          pm.expect(r.codigo).to.eql('VALIDACION');
          pm.expect(r.campo).to.eql('nombres');
          pm.expect(r.mensaje).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 1300
