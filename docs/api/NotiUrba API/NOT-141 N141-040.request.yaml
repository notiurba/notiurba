$kind: "http-request"
description: "Cambiar estado (QA)\n\nSolo reporte QA; comprobar enum exacto en backend y actualizar si corresponde. Contrato inspeccionado: local d8e8b2b y develop 8b8419a (14/11/2026). Expectativa documental; no es respuesta observada. Omitida no equivale a aprobada.\n\nRespuesta esperada: HTTP 200. Las aserciones siguientes definen el cuerpo del contrato; no se ha capturado respuesta de Render. Errores: {codigo, mensaje, campo}; mensaje es texto, campo puede ser null. Sin permisos en recurso ajeno: 404 por ocultación, no 403."
url: "{{baseUrl}}/api/admin/reportes/{{codigoReporte}}/estado"
method: "PATCH"
order: 20390
auth:
  type: "bearer"
  credentials:
    token: "{{tokenAdmin}}"
headers:
  Content-Type: "application/json"
body:
  type: "json"
  content: "{\n  \"estado\": \"EN_TRAMITE\",\n  \"observacion\": \"Prueba NOT-141\"\n}"
scripts:
  -
    type: "beforeRequest"
    code: "if (pm.variables.get('habilitarEscrituras') !== 'true') {\n  console.warn('OMITIDA por seguridad: active habilitarEscrituras solo en un entorno QA autorizado.');\n  pm.execution.skipRequest();\n}\nif (!pm.variables.get('codigoReporte')) { console.warn('BLOQUEADA: falta codigoReporte'); pm.execution.skipRequest(); }\nif (!pm.variables.get('tokenAdmin')) { console.warn('BLOQUEADA: falta tokenAdmin'); pm.execution.skipRequest(); }\nif (pm.variables.get('cuentaQAConfirmada') !== 'true') pm.execution.skipRequest();"
    language: "text/javascript"
  -
    type: "afterResponse"
    code: "pm.test('Estado HTTP esperado: 200', function () { pm.expect([200]).to.include(pm.response.code); });"
    language: "text/javascript"
