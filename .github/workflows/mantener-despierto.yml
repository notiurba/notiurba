name: Mantener despierto el servidor
# Render Free duerme el servidor tras 15 min sin tráfico. Este aviso lo consulta cada 5 min.
# Solo corre desde la rama por defecto (main). GitHub no garantiza la hora exacta de los avisos programados.
# Si GitHub lo pausa por falta de actividad (60 días), se reactiva desde Actions > Run workflow.
"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Una ruta protegida responde 401 sin tocar la base: despierta a Render y deja dormir a Neon.
      - name: Consultar el servidor
        run: |
          codigo=$(curl --silent --output /dev/null --max-time 240 --write-out '%{http_code}' https://notiurba-api.onrender.com/api/admin/ping || true)
          echo "Respuesta: $codigo"
          [ "$codigo" = "401" ] || [ "$codigo" = "403" ]
